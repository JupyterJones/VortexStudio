[project]
name = "tidalvortex"
version = "0.1.0-alpha.0"
description = "Python port of TidalCycles"
authors = [
    { name = "Tidal Cyclists", email = "vortex@tidalcycles.org" },
]
urls = { repository = "https://codeberg.org/uzu/vortex" }
license = "GPL-3.0-or-later"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Artistic Software",
  "Topic :: Multimedia :: Sound/Audio",
]

requires-python = ">=3.11,<3.14"
dependencies = [
    "parsy (>=2.2,<3.0)",
    "linkpython-extern (>=1.2.0,<2.0.0)",
    "pyliblo3 (>=0.16.4,<0.17.0)",
    "ipython (>=9.8.0,<10.0.0)",
    "parsimonious (>=0.11.0,<0.12.0)",
    "pyqt6 (>=6.10.1,<7.0.0)",
    "pyqt6-qscintilla (>=2.14.1,<3.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-reorder (>=0.1.1,<0.2.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "pytest-watch (>=4.2.0,<5.0.0)",
    "pytest-benchmark (>=5.2.3,<6.0.0)"
]

[project.scripts]
vortex = 'vortex.cli:run'

[tool.poetry]
packages = [
    { include = "vortex" }
]

[tool.poetry.requires-plugins]
poetry-plugin-shell = { version = ">=1.0.1,<2.0.0" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
