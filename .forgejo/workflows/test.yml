# This workflow will install Python dependencies and run tests except on branch 'main' where CI action is used
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Vortex Tests

on:
  push:
    branches:
    - '**'      # matches every branch
    - '!main'   # excludes main

jobs:
  build:

    runs-on: codeberg-tiny-lazy
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: https://code.forgejo.org/actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: https://code.forgejo.org/actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt update -y
        sudo apt install -y liblo-dev
    - name: Install Poetry
      run: |
        python -m pip install --upgrade poetry==2.2.1
    - name: Install all dependencies
      run: |
        poetry install
    - name: Run tests
      run: |
        poetry run pytest
